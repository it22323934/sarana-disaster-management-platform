[project]
name = "sarana"
version = "0.1.0"
description = "SARANA - AI-enabled, offline-first, multi-hazard disaster response platform for Sri Lanka"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/py-shared", "services/*"]

[tool.uv.sources]
sarana-shared = { workspace = true }

[tool.pytest.ini_options]
consider_namespace_packages = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/py-shared/tests", "services", "tests"]
# importlib mode derives a unique module name from each test file's path. Without it,
# six services each holding a `tests/test_health.py` collide on module name and pytest
# refuses to collect them in one run.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "live_llm: hits the real OpenAI API; skipped unless --live-llm is passed",
]
