[project]
name = "sarana-gov-mock"
version = "0.1.0"
description = "SARANA Government and Telco Mocks - Every mocked government and telco system, with realistic contracts, configurable latency and failure injection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sarana-shared",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "sarana-shared[testing]",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_mock"]

[tool.uv.sources]
sarana-shared = { workspace = true }
