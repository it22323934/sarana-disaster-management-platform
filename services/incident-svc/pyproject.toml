[project]
name = "incident-svc"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
description = "SARANA incident-svc — intake, verification, triage, dispatch."
dependencies = [
    "sarana-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0"]

[tool.uv.sources]
sarana-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_svc"]
