# SARANA local development stack.
#
# `make up` builds, starts, waits for every healthcheck, migrates and seeds.
# Port map is documented in the Makefile (`make ports`) and in .env.example.
#
# Host-side ports are overridable through SARANA_HOST_PORT_* so a developer who
# already runs Postgres or Redis for another project can bring this stack up without
# stopping it. Container-side ports never change - service-to-service URLs are fixed.

name: sarana

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [sarana]
  env_file: [../../.env]
  environment:
    # Inside the network, services address each other by container name.
    SARANA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sarana}:${POSTGRES_PASSWORD:-sarana_local_only}@postgres:5432/${POSTGRES_DB:-sarana}
    SARANA_REDIS_URL: redis://redis:6379/0
    SARANA_S3_ENDPOINT_URL: http://minio:9000
    SARANA_OTLP_ENDPOINT: http://jaeger:4317
    SARANA_SMTP_HOST: mailpit
    SARANA_SMTP_PORT: "1025"
    SARANA_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    SARANA_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
    SARANA_CORE_API_URL: http://core-api:8001
    SARANA_INCIDENT_SVC_URL: http://incident-svc:8002
    SARANA_ALERTING_SVC_URL: http://alerting-svc:8003
    SARANA_LEDGER_SVC_URL: http://ledger-svc:8004
    SARANA_AGENT_SVC_URL: http://agent-svc:8005
    SARANA_GOV_MOCK_URL: http://gov-mock:8006
  volumes:
    # Development keypair, read-only. Generated by `make keys`, never committed.
    - ./dev-keys:/run/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

networks:
  sarana:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    build:
      context: ./postgres
    image: sarana/postgres:16-3.4-pgvector
    networks: [sarana]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sarana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarana_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sarana}
      # Speeds up the initial cluster creation; local data is disposable.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports: ["${SARANA_HOST_PORT_POSTGRES:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sarana} -d ${POSTGRES_DB:-sarana}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    networks: [sarana]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${SARANA_HOST_PORT_REDIS:-6379}:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    networks: [sarana]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SARANA_S3_ACCESS_KEY_ID:-sarana_minio}
      MINIO_ROOT_PASSWORD: ${SARANA_S3_SECRET_ACCESS_KEY:-sarana_minio_local_only}
    ports:
      - "${SARANA_HOST_PORT_MINIO:-9000}:9000"
      - "${SARANA_HOST_PORT_MINIO_CONSOLE:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot bucket creation. Behind a profile so it is not part of the default `up`:
  # `docker compose up --wait` treats a container that exits as a failed service, and a
  # task that is supposed to finish would fail the whole stack. `make up` runs it with
  # `compose run` once MinIO reports healthy.
  minio-init:
    image: minio/mc:latest
    profiles: [init]
    networks: [sarana]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${SARANA_S3_ACCESS_KEY_ID:-sarana_minio}
      MINIO_ROOT_PASSWORD: ${SARANA_S3_SECRET_ACCESS_KEY:-sarana_minio_local_only}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/sarana-media
        mc mb --ignore-existing local/sarana-ledger-anchor
        # The anchor bucket is versioned locally; on AWS it carries Object Lock in
        # compliance mode, which MinIO can only enable at creation on a licensed
        # deployment. Versioning is the closest local approximation (ADR-005).
        mc version enable local/sarana-ledger-anchor
        echo "buckets ready"

  # Jaeger v2. OTLP is on by default; the image is distroless, so it carries no
  # healthcheck - no service depends on traces being available to serve traffic.
  jaeger:
    image: jaegertracing/jaeger:latest
    networks: [sarana]
    ports:
      - "${SARANA_HOST_PORT_JAEGER:-16686}:16686"
      - "${SARANA_HOST_PORT_OTLP_GRPC:-4317}:4317"
      - "${SARANA_HOST_PORT_OTLP_HTTP:-4318}:4318"

  mailpit:
    image: axllent/mailpit:latest
    networks: [sarana]
    ports:
      - "${SARANA_HOST_PORT_MAILPIT:-8025}:8025"
      - "${SARANA_HOST_PORT_SMTP:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  core-api:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/core-api/Dockerfile
    image: sarana/core-api:dev
    ports: ["${SARANA_HOST_PORT_CORE_API:-8001}:8001"]
    volumes:
      - ./dev-keys:/run/secrets:ro
      # Hot reload: the source tree is mounted over the image copy.
      - ../../services/core-api/src:/app/services/core-api/src:ro
      - ../../packages/py-shared/src:/app/packages/py-shared/src:ro
    command:
      - uvicorn
      - --factory
      - core_api.main:build_app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/services/core-api/src
      - --reload-dir
      - /app/packages/py-shared/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  incident-svc:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/incident-svc/Dockerfile
    image: sarana/incident-svc:dev
    ports: ["${SARANA_HOST_PORT_INCIDENT_SVC:-8002}:8002"]
    volumes:
      - ./dev-keys:/run/secrets:ro
      # Hot reload: the source tree is mounted over the image copy.
      - ../../services/incident-svc/src:/app/services/incident-svc/src:ro
      - ../../packages/py-shared/src:/app/packages/py-shared/src:ro
    command:
      - uvicorn
      - --factory
      - incident_svc.main:build_app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/services/incident-svc/src
      - --reload-dir
      - /app/packages/py-shared/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  alerting-svc:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/alerting-svc/Dockerfile
    image: sarana/alerting-svc:dev
    ports: ["${SARANA_HOST_PORT_ALERTING_SVC:-8003}:8003"]
    volumes:
      - ./dev-keys:/run/secrets:ro
      # Hot reload: the source tree is mounted over the image copy.
      - ../../services/alerting-svc/src:/app/services/alerting-svc/src:ro
      - ../../packages/py-shared/src:/app/packages/py-shared/src:ro
    command:
      - uvicorn
      - --factory
      - alerting_svc.main:build_app
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
      - --reload
      - --reload-dir
      - /app/services/alerting-svc/src
      - --reload-dir
      - /app/packages/py-shared/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  ledger-svc:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/ledger-svc/Dockerfile
    image: sarana/ledger-svc:dev
    ports: ["${SARANA_HOST_PORT_LEDGER_SVC:-8004}:8004"]
    volumes:
      - ./dev-keys:/run/secrets:ro
      # Hot reload: the source tree is mounted over the image copy.
      - ../../services/ledger-svc/src:/app/services/ledger-svc/src:ro
      - ../../packages/py-shared/src:/app/packages/py-shared/src:ro
    command:
      - uvicorn
      - --factory
      - ledger_svc.main:build_app
      - --host
      - "0.0.0.0"
      - --port
      - "8004"
      - --reload
      - --reload-dir
      - /app/services/ledger-svc/src
      - --reload-dir
      - /app/packages/py-shared/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  agent-svc:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/agent-svc/Dockerfile
    image: sarana/agent-svc:dev
    ports: ["${SARANA_HOST_PORT_AGENT_SVC:-8005}:8005"]
    volumes:
      - ./dev-keys:/run/secrets:ro
      # Hot reload: the source tree is mounted over the image copy.
      - ../../services/agent-svc/src:/app/services/agent-svc/src:ro
      - ../../packages/py-shared/src:/app/packages/py-shared/src:ro
    command:
      - uvicorn
      - --factory
      - agent_svc.main:build_app
      - --host
      - "0.0.0.0"
      - --port
      - "8005"
      - --reload
      - --reload-dir
      - /app/services/agent-svc/src
      - --reload-dir
      - /app/packages/py-shared/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8005/healthz"]
