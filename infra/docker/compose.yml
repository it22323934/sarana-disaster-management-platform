  gov-mock:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: services/gov-mock/Dockerfile
    image: sarana/gov-mock:dev
    ports: ["${SARANA_HOST_PORT_GOV_MOCK:-8006}:8006"]
    volumes:
