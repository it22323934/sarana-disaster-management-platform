[mypy]
python_version = 3.12
plugins = pydantic.mypy
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
show_error_codes = True
; Alembic trees and per-service test packages are script contexts, not importable
; modules - six files each named `env.py` or `tests` collide on module name. Both
; are covered by ruff, and the tests run for real under pytest.
exclude = (^|/)(\.venv|node_modules|alembic|tests)/

; Conventions: mypy --strict on py-shared and ledger-svc.
[mypy-sarana_shared.*]
strict = True

[mypy-ledger_svc.*]
strict = True

; Third-party packages without bundled type information are declared here as they
; are actually imported, so `warn_unused_configs` stays meaningful.
[mypy-testcontainers.*]
ignore_missing_imports = True

; boto3 ships no type stubs and is only imported on the AWS code path.
[mypy-boto3.*]
ignore_missing_imports = True

# OR-Tools ships no py.typed marker, so its routing solver is untyped to mypy. The agent's
# own wrapper around it is fully typed; this only silences the import itself.
[mypy-ortools.*]
ignore_missing_imports = True
